# Настройки сервиса коротких ссылок

# Домен, который подставляется перед кодом короткой ссылки
link.domain=clck.ru

# Длина кода короткой ссылки (символы a-z, A-Z, 0-9)
link.code-length=6

# Время жизни ссылки в минутах (1440 = сутки, 60 = час)
link.ttl-minutes=1440

# Лимит переходов, если пользователь его не указал
link.default-max-clicks=10

# Максимально допустимый лимит переходов
link.max-clicks-limit=10000

# Как часто фоновая задача удаляет просроченные ссылки, в секундах
cleanup.interval-seconds=60
